[pytest]
testpaths = tests
base_url = https://www.saucedemo.com
addopts = -ra --strict-markers
markers =
    ui: browser tests against saucedemo.com
    api: REST API tests against jsonplaceholder.typicode.com
    smoke: critical-path checks to run first
    known_bug: documented product defects, expected to fail (xfail)
xfail_strict = true
